name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        # Deliberately NOT android-actions/setup-android: it installs the
        # long-removed 'tools' package and dies with "Failed to find package".
        # Ubuntu runners already ship the SDK, so use that directly.
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -r | head -1)
          echo "Using $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install SDK platforms
        # compileSdk 37 is recent and may not be published yet; fall back to 36 so
        # the failure mode is a clear version mismatch, not a resolution error.
        run: |
          set -e
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" \
            || "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "--- installed platforms ---"
          ls "${ANDROID_HOME}/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # This project has no committed wrapper jar, so provision Gradle directly.
          gradle-version: '9.7.1'

      - name: Build debug APK
        id: build
        # Debug rather than release: it needs no signing secrets and no R8, which
        # matters because Filament reaches into native code through JNI and this
        # app has never been through a shrinker.
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Unit tests (camera maths)
        # Plain JVM tests under app/src/test. A failure here stops the APK from being
        # published, same as a compile error.
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        if: success()
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "Found: $APK ($(du -h "$APK" | cut -f1))"
          cp "$APK" "${{ github.workspace }}/3xdezine.apk"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3xdezine-debug-apk
          path: 3xdezine.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore

      - name: Publish to rolling release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          TAG=android-latest
          NOTES="Debug-signed APK built from ${{ github.sha }}.

          Install on Android: download, then allow your browser to install unknown apps when prompted.
          Size: ${{ steps.apk.outputs.size }}

          This is a debug build, so it is signed with an ephemeral key. If an update
          refuses to install, uninstall the previous copy first."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" 3xdezine.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" 3xdezine.apk \
              --title "3xDezine Android (latest)" \
              --notes "$NOTES"
          fi
