## 3xDezine Android — Gradle version catalog.
## Versions verified current as of 2026-09-21. See ARCHITECTURE.md > "Android client".
##
## HARD RULE: there is deliberately NO `com.google.android.filament:*` entry here.
## SceneView 4.38.0 pins Filament 1.72.1 and ships PRECOMPILED .filamat ubershaders
## built against it. Filament 1.73/1.75/1.76/1.77 each carry a
## "Recompile Materials / New Material Version" warning, so force-upgrading Filament
## makes SceneView's materials fail to load at runtime. Let SceneView bring Filament
## in transitively and never override it.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"

compileSdk = "37"
targetSdk = "36"
minSdk = "26"

composeBom = "2026.09.00"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"

sceneview = "4.38.0"
kotlinMath = "1.8.0"

retrofit = "3.0.0"
okhttp = "5.5.0"
serialization = "1.11.0"
coroutines = "1.11.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# Brings Filament 1.72.1 transitively. Do not add Filament yourself.
sceneview = { module = "io.github.sceneview:sceneview", version.ref = "sceneview" }
kotlin-math = { module = "dev.romainguy:kotlin-math", version.ref = "kotlinMath" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
# AGP 9 removed support for applying `org.jetbrains.kotlin.android`; built-in Kotlin
# is enabled by default by `com.android.application`. Do NOT add the Kotlin Android
# plugin back — these three are the complete, correct set.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
